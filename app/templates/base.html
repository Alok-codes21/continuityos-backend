
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ContinuityOS{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">Continuity<span>OS</span></div>

            <div class="nav-label">WORKSPACE</div>
            <a class="nav-link active" href="/">Overview</a>
            <a class="nav-link" href="#">Knowledge Graph</a>
            <a class="nav-link" href="#">Knowledge Ledger</a>

            <div class="nav-label">CONTINUITY</div>
            <a class="nav-link" href="#">Departure Simulator</a>
            <a class="nav-link" href="#">AI Handover</a>
            <a class="nav-link" href="#">Rehearsal</a>

            <div class="nav-label">MANAGEMENT</div>
            <a class="nav-link" href="#">Integrations</a>
            <a class="nav-link" href="#">Settings</a>

            <div class="sidebar-footer">Organizational Intelligence</div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button id="menu-toggle" class="menu-toggle">☰</button>
                <span>Organization / Overview</span>
                <span class="system-status">● System initialized</span>
            </header>

            <section class="page-content">
                {% block content %}{% endblock %}
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
